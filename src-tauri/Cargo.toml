[package]
name = "screenpin"
version = "0.2.0"
description = "A non-destructive cross-platform screenshot editor"
authors = ["ScreenPin contributors"]
edition = "2021"

[lib]
name = "screenpin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22.1"
dirs = "5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-global-shortcut = "2"
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.12", features = ["global_shortcuts", "screenshot"] }
futures-util = "0.3"
raw-window-handle = "0.6"
