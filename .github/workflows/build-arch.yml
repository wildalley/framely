name: Build Arch Linux package

on:
  push:
    branches: [main]
    tags: ["v0.1.*"]
    paths: &legacy-paths
      - '.github/workflows/build-arch.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'packaging/arch/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
  pull_request:
    paths: *legacy-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and validate pacman package in Arch Linux
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed \
                base-devel curl file git gtk3 libayatana-appindicator npm \
                openssl pkgconf rust webkit2gtk-4.1 wget xdg-desktop-portal
              useradd --create-home --shell /bin/bash builder
              chown -R builder:builder /workspace
              runuser --preserve-environment -u builder -- env HOME=/home/builder npm ci --no-audit --no-fund
              runuser --preserve-environment -u builder -- env HOME=/home/builder npm test
              runuser --preserve-environment -u builder -- env HOME=/home/builder cargo test --manifest-path src-tauri/Cargo.toml --locked
              runuser --preserve-environment -u builder -- env HOME=/home/builder cargo check --manifest-path src-tauri/Cargo.toml --locked
              runuser -u builder -- cargo run --release --manifest-path src-tauri/Cargo.toml --example capture_memory --locked
              runuser --preserve-environment -u builder -- env HOME=/home/builder npm run build:arch
              package="$(cd packaging/arch && runuser --preserve-environment -u builder -- env HOME=/home/builder makepkg --packagelist | head -n 1)"
              pacman --query --info --file "$package"
              pacman --query --list --file "$package"
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenpin-arch-${{ github.sha }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
