name: Release native installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-native.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: framely-native-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Check version, assets and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify-release-assets.py release-assets
          cd release-assets
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --latest
          --title "Framely 取景 $GITHUB_REF_NAME"
          --notes-file docs/releases/${GITHUB_REF_NAME}.md
