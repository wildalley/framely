name: Release native installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-native.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check version, assets and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify-release-assets.py release-assets
          cd release-assets
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --latest
          --title "ScreenPin $GITHUB_REF_NAME — MyGo 原生版"
          --notes-file docs/releases/${GITHUB_REF_NAME}.md
