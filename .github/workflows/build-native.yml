name: Build MyGo native preview

on:
  push:
    branches: [main, "refactor/mygo-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check OCR protocol and release validation regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check native versions before building
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/verify-release-assets.py

  native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install isolated D-Bus test service
        run: sudo apt-get update && sudo apt-get install --yes dbus

      - name: Check formatting, tests and static analysis
        run: |
          test -z "$(gofmt -l assets cmd internal)"
          go test -race ./...
          go test -tags nodynamic ./internal/render
          go vet ./...

      - name: Check repeated image allocation and release
        env:
          SCREENPIN_MEMORY_AUDIT: '1'
        run: go test -count=1 -run TestSoftwareImageLifecycleMemoryStress -v ./internal/editor

      - name: Build native applications
        run: go tool mygo build -platform linux/amd64,windows/amd64,darwin/arm64 -skip-installer -skip-dmg -skip-notarize

  components:
    needs: preflight
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            folder: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            folder: windows-amd64
          - os: macos-15
            platform: darwin/arm64
            folder: darwin-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            folder: darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: '0.11.28'
      - name: Install Linux capture headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libpipewire-0.3-dev
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build native capture and offline OCR workers
        run: python scripts/build-components.py
      - name: Test Linux DMA-BUF capture buffers
        if: runner.os == 'Linux'
        run: bash scripts/test-capture.sh
      - name: Test packaged OCR runtime
        env:
          SCREENPIN_OCR_INTEGRATION: '1'
        run: go test -v ./internal/ocr
      - name: Test platform application code
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Bundle application and workers
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-notarize -skip-dmg
      - name: Verify bundled runtimes and collect installers
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenpin-native-${{ matrix.folder }}-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  arch-native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and inspect native pacman package
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed \
                base-devel go gtk3 libayatana-appindicator xdg-desktop-portal libpipewire uv python pkgconf
              useradd --create-home --shell /bin/bash builder
              chown -R builder:builder /workspace
              cd packaging/arch-native
              runuser -u builder -- makepkg --cleanbuild --noconfirm
              package="$(runuser -u builder -- makepkg --packagelist)"
              pacman --query --info --file "$package"
              pacman --query --list --file "$package"
            '

      - name: Upload native Arch preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenpin-native-arch-${{ github.sha }}
          path: packaging/arch-native/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
