name: Build MyGo native preview

on:
  push:
    branches: [main, "refactor/mygo-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check OCR protocol and release validation regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check native versions before building
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/verify-release-assets.py

  native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install isolated D-Bus test service
        run: sudo apt-get update && sudo apt-get install --yes dbus

      - name: Check formatting, tests and static analysis
        run: |
          test -z "$(gofmt -l assets cmd internal)"
          go test -race ./...
          go test -tags nodynamic ./internal/render
          go vet ./...

      - name: Check repeated image allocation and release
        env:
          SCREENPIN_MEMORY_AUDIT: '1'
        run: go test -count=1 -run TestSoftwareImageLifecycleMemoryStress -v ./internal/editor

      - name: Build native applications
        run: go tool mygo build -platform linux/amd64,windows/amd64,darwin/arm64 -skip-installer -skip-dmg -skip-notarize

  components:
    needs: preflight
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            folder: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            folder: windows-amd64
          - os: macos-15
            platform: darwin/arm64
            folder: darwin-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            folder: darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: '0.11.28'
          cache-dependency-glob: |
            workers/ocr/requirements.lock
            workers/ocr/rapidocr.lock
      - name: Install Linux capture headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libpipewire-0.3-dev libva-dev nasm pkg-config
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install macOS media build tools
        if: runner.os == 'macOS'
        run: brew install pkgconf nasm
      - name: Install Windows media build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm make pkgconf nasm'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native capture, media and offline OCR workers
        run: python scripts/build-components.py
      - name: Test Linux DMA-BUF capture buffers
        if: runner.os == 'Linux'
        run: bash scripts/test-capture.sh
      - name: Test native 1080p60 timing and packaged GIF export
        run: python scripts/test-media.py
      - name: Test packaged OCR runtime
        env:
          SCREENPIN_OCR_INTEGRATION: '1'
        run: go test -v ./internal/ocr
      - name: Test platform application code
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Bundle application and workers
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-notarize -skip-dmg
      - name: Verify bundled runtimes and collect installers
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenpin-native-${{ matrix.folder }}-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-artifacts:
    # Tagged releases validate the same assets in the publish job.
    if: github.ref_type != 'tag'
    needs: [components, arch-native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenpin-native-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Verify every release asset after upload and download
        run: |
          version="$(python -c 'import json; print(json.load(open("mygo.json"))["version"])')"
          RELEASE_TAG="v$version" python scripts/verify-release-assets.py release-assets

  arch-native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect native pacman package
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed \
                base-devel go gtk3 libayatana-appindicator xdg-desktop-portal libpipewire libva nasm uv python pkgconf
              useradd --create-home --shell /bin/bash builder
              chown -R builder:builder /workspace
              cd packaging/arch-native
              runuser -u builder -- makepkg --cleanbuild --noconfirm
              package="$(runuser -u builder -- makepkg --packagelist)"
              pacman --query --info --file "$package"
              pacman --query --list --file "$package"
            '

      - name: Upload native Arch preview package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenpin-native-arch-${{ github.sha }}
          path: packaging/arch-native/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
